services:
  - type: web
    name: cloud-network-alert
    runtime: node
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-network-alert-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: COOKIE_NAME
        value: nas_token
      # After the first deploy, set this to your live Render URL,
      # e.g. https://cloud-network-alert.onrender.com
      # (single-service deploys mostly avoid CORS issues since the
      # frontend is served from the same origin, but this is still
      # used as the Socket.IO / cookie origin allow-list.)
      - key: CLIENT_URL
        sync: false
      - key: SIMULATION_MODE
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: SEED_ADMIN_NAME
        value: System Administrator
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: cloud-network-alert-db
    plan: free
    databaseName: network_alert
    user: network_alert_user
